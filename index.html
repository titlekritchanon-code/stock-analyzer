<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Analyzer — Fixed</title><style>body{background:#0b1020;color:#e8eefc;font:16px system-ui;max-width:1050px;margin:auto;padding:28px}input,button{padding:12px;border-radius:9px;font:inherit}button{background:#3282ff;color:white;border:0;cursor:pointer}section{background:#152039;padding:20px;border-radius:12px;margin:18px 0}td,th{padding:12px;text-align:left;border-bottom:1px solid #34415e}table{width:100%;border-collapse:collapse}small{color:#b0c0dd}.warning{color:#ffcb7a}svg{width:100%;height:240px}a{color:#91caff}.scroll{overflow:auto}</style><h1>Stock Analyzer</h1><p>หุ้นสหรัฐฯ • ไม่ใช้ API key • ข้อมูลตามที่แหล่งข้อมูลเผยแพร่</p><form id="form"><input id="ticker" placeholder="TEM, AAPL, NVDA" required maxlength="15"><button id="btn">วิเคราะห์</button></form><p id="status"></p><main id="out"></main><script>
const $=x=>document.getElementById(x),num=x=>x==null?'ไม่มีข้อมูล':Number(x).toLocaleString('en-US',{maximumFractionDigits:2}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(location.protocol==='file:')$('status').textContent='กรุณารัน server.py แล้วเปิด http://localhost:8000 ไม่ใช่เปิด HTML โดยตรง';
$('form').onsubmit=async e=>{e.preventDefault();$('btn').disabled=true;$('out').innerHTML='';$('status').textContent='กำลังโหลดข้อมูล อาจใช้เวลาประมาณหนึ่งนาที…';try{const r=await fetch('/api/analyze?symbol='+encodeURIComponent($('ticker').value.trim()));if(!r.ok)throw Error('Server HTTP '+r.status);const d=await r.json();let h='<h2>'+esc(d.symbol)+'</h2><small>เวลาที่ดึง: '+esc(d.retrieved)+' (ไม่ใช่เวลาซื้อขาย)</small>';for(const [k,v]of Object.entries(d.errors))h+='<section class="warning">โหลด '+esc(k)+' ไม่สำเร็จ: '+esc(v)+'</section>';if(d.prices){const p=d.prices,a=p.rows,last=a.at(-1),slice=a.slice(-252),values=slice.map(x=>x.close),mi=Math.min(...values),ma=Math.max(...values),points=values.map((x,i)=>(i/(values.length-1)*960)+','+(210-(x-mi)/(ma-mi||1)*190)).join(' ');h+='<section><h2>ราคา $'+num(last.close)+'</h2><p>วันที่ข้อมูลราคา: '+esc(last.date)+' • ราคาปิด ไม่ใช่ราคาสด</p><svg viewBox="0 0 960 240" preserveAspectRatio="none"><polyline points="'+points+'" fill="none" stroke="#56a0ff" stroke-width="2"/></svg><p>SMA50: '+num(p.sma50)+' • SMA200: '+num(p.sma200)+'</p><p>แนวโน้ม: '+(p.sma200==null?'ข้อมูลไม่ครบ 200 วัน':last.close>p.sma200?'ราคาอยู่เหนือ SMA200':'ราคาอยู่ใต้ SMA200')+'</p><h3>แนวรับจาก swing low ย้อนหลังสูงสุด 3 ปี</h3><p>'+p.supports.map(x=>'$'+num(x)).join(' • ')+'</p><small>คัดระดับที่ต่ำกว่าราคาปัจจุบันและห่างกันประมาณ 2.5% ไม่รับรองว่าจะรับราคาได้</small><p><a href="'+p.source+'" target="_blank" rel="noopener">แหล่งราคา Stooq</a></p></section>';}if(d.financials){const f=d.financials;h+='<section><h2>'+esc(f.name)+'</h2><p>ผลประกอบการ: งบปีล่าสุดที่ดึงได้ • ฐานะการเงิน: วันสิ้นงวดล่าสุดที่ดึงได้</p><p>รายได้เติบโตเทียบงบปีก่อน: '+num(f.growth)+(f.growth==null?'':'%')+'</p><div class="scroll"><table><tr><th>รายการ (USD)</th><th>จำนวน</th><th>สิ้นงวด</th><th>ยื่นเมื่อ</th></tr>';for(const [k,v]of Object.entries(f.metrics))h+='<tr><td>'+esc(k)+'</td><td>'+num(v?.val)+'</td><td>'+esc(v?.end||'—')+'</td><td>'+esc(v?.filed||'—')+'</td></tr>';h+='</table></div><p><a href="'+f.source+'" target="_blank" rel="noopener">ตรวจเอกสารยื่นต่อ SEC</a></p></section>';}h+='<section><small>ไม่เติมเลขที่ไม่มี ไม่สร้างคะแนนหรือคำแนะนำซื้อขายจากข้อมูลไม่ครบ เวอร์ชันนี้ยังไม่มีข่าว ราคาสด และการวิเคราะห์งบไตรมาสครบชุด</small></section>';$('out').innerHTML=h;$('status').textContent=Object.keys(d.errors).length?'โหลดสำเร็จบางส่วน ดูรายละเอียดด้านล่าง':'โหลดสำเร็จ';}catch(e){$('status').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: '+e.message+' — กรุณารัน python server.py แล้วเปิด http://localhost:8000';}finally{$('btn').disabled=false}};
</script></html>
